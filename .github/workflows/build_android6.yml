name: Build Android 6 Compatible APK

on:
    workflow_dispatch:

jobs:
    android6:
        name: Build Android 6.0+ APK
        runs-on: ubuntu-latest
        permissions: write-all

        steps:
            - name: 代码迁出
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: 构建Java环境
              uses: actions/setup-java@v4
              with:
                  distribution: "zulu"
                  java-version: "17"
                  cache: "gradle"
                  cache-dependency-path: |
                      android/*.gradle*
                      android/**/gradle-wrapper.properties

            - name: 安装Flutter
              uses: subosito/flutter-action@v2
              id: flutter-action
              with:
                  channel: stable
                  flutter-version-file: pubspec.yaml
                  cache: true

            - name: 安装 PowerShell
              run: |
                  sudo apt-get update
                  sudo apt-get install -y powershell

            - name: 安装 Android SDK 37
              run: |
                  echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-37" || true

            - name: 修补 Flutter 引擎以兼容 Android 6 (API 23)
              run: |
                  echo "=== Patching Flutter engine JARs for API 23 compatibility ==="
                  FLUTTER_ROOT="${{ steps.flutter-action.outputs.FLUTTER_ROOT }}"
                  if [ -z "$FLUTTER_ROOT" ]; then
                    FLUTTER_ROOT="$(dirname $(dirname $(which flutter)))"
                  fi
                  echo "Flutter root: $FLUTTER_ROOT"

                  # Write the patched LocalizationPlugin.java
                  # This adds back the API level guard for getLocales() that was removed
                  # when Flutter raised minSdkVersion to 24
                  cat > /tmp/LocalizationPlugin.java << 'JAVAEOF'
                  package io.flutter.plugin.localization;

                  import android.annotation.SuppressLint;
                  import android.content.Context;
                  import android.content.res.Configuration;
                  import android.os.Build;
                  import android.os.LocaleList;
                  import androidx.annotation.NonNull;
                  import androidx.annotation.Nullable;
                  import androidx.annotation.VisibleForTesting;
                  import io.flutter.embedding.engine.systemchannels.LocalizationChannel;
                  import java.util.ArrayList;
                  import java.util.List;
                  import java.util.Locale;

                  public class LocalizationPlugin {
                    @NonNull private final LocalizationChannel localizationChannel;
                    @NonNull private final Context context;

                    @SuppressLint({"AppBundleLocaleChanges", "DiscouragedApi"})
                    @VisibleForTesting
                    final LocalizationChannel.LocalizationMessageHandler localizationMessageHandler =
                        new LocalizationChannel.LocalizationMessageHandler() {
                          @Override
                          public String getStringResource(@NonNull String key, @Nullable String localeString) {
                            Context localContext = context;
                            if (localeString != null) {
                              Locale locale = localeFromString(localeString);
                              Configuration config = new Configuration(context.getResources().getConfiguration());
                              config.setLocale(locale);
                              localContext = context.createConfigurationContext(config);
                            }
                            String packageName = context.getPackageName();
                            int resId = localContext.getResources().getIdentifier(key, "string", packageName);
                            if (resId != 0) {
                              return localContext.getResources().getString(resId);
                            }
                            return null;
                          }
                        };

                    public LocalizationPlugin(
                        @NonNull Context context, @NonNull LocalizationChannel localizationChannel) {
                      this.context = context;
                      this.localizationChannel = localizationChannel;
                      this.localizationChannel.setLocalizationMessageHandler(localizationMessageHandler);
                    }

                    @SuppressWarnings("deprecation")
                    @Nullable
                    public Locale resolveNativeLocale(@Nullable List<Locale> supportedLocales) {
                      if (supportedLocales == null || supportedLocales.isEmpty()) {
                        return null;
                      }
                      // API 26+: use LanguageRange
                      if (Build.VERSION.SDK_INT >= 26) {
                        List<Locale.LanguageRange> languageRanges = new ArrayList<>();
                        LocaleList localeList = context.getResources().getConfiguration().getLocales();
                        int localeCount = localeList.size();
                        for (int index = 0; index < localeCount; ++index) {
                          Locale locale = localeList.get(index);
                          String fullRange = locale.getLanguage();
                          if (!locale.getScript().isEmpty()) {
                            fullRange += "-" + locale.getScript();
                          }
                          if (!locale.getCountry().isEmpty()) {
                            fullRange += "-" + locale.getCountry();
                          }
                          languageRanges.add(new Locale.LanguageRange(fullRange));
                          languageRanges.add(new Locale.LanguageRange(locale.getLanguage()));
                          languageRanges.add(new Locale.LanguageRange(locale.getLanguage() + "-*"));
                        }
                        Locale platformResolvedLocale = Locale.lookup(languageRanges, supportedLocales);
                        if (platformResolvedLocale != null) {
                          return platformResolvedLocale;
                        }
                        return supportedLocales.get(0);
                      } else if (Build.VERSION.SDK_INT >= 24) {
                        // API 24-25: use getLocales() without LanguageRange
                        LocaleList localeList = context.getResources().getConfiguration().getLocales();
                        for (int index = 0; index < localeList.size(); ++index) {
                          Locale preferredLocale = localeList.get(index);
                          for (Locale locale : supportedLocales) {
                            if (preferredLocale.equals(locale)) return locale;
                          }
                          for (Locale locale : supportedLocales) {
                            if (preferredLocale.getLanguage().equals(locale.toLanguageTag())) return locale;
                          }
                          for (Locale locale : supportedLocales) {
                            if (preferredLocale.getLanguage().equals(locale.getLanguage())) return locale;
                          }
                        }
                        return supportedLocales.get(0);
                      }
                      // API 23 and below: use deprecated config.locale
                      Locale preferredLocale = context.getResources().getConfiguration().locale;
                      if (preferredLocale != null) {
                        for (Locale locale : supportedLocales) {
                          if (preferredLocale.equals(locale)) return locale;
                        }
                        for (Locale locale : supportedLocales) {
                          if (preferredLocale.getLanguage().equals(locale.toString())) return locale;
                        }
                      }
                      return supportedLocales.get(0);
                    }

                    @SuppressWarnings("deprecation")
                    public void sendLocalesToFlutter(@NonNull Configuration config) {
                      List<Locale> locales = new ArrayList<>();
                      if (Build.VERSION.SDK_INT >= 24) {
                        LocaleList localeList = config.getLocales();
                        int localeCount = localeList.size();
                        for (int index = 0; index < localeCount; ++index) {
                          locales.add(localeList.get(index));
                        }
                      } else {
                        // Fallback for API 23: use deprecated single locale
                        locales.add(config.locale);
                      }
                      localizationChannel.sendLocales(locales);
                    }

                    @VisibleForTesting
                    static Locale localeFromString(@NonNull String localeString) {
                      if (localeString.contains("-")) {
                        String[] parts = localeString.split("-", -1);
                        if (parts.length == 1) return new Locale(parts[0]);
                        else if (parts.length == 2) return new Locale(parts[0], parts[1]);
                        else return new Locale(parts[0], parts[2], parts[1]);
                      }
                      return new Locale(localeString);
                    }
                  }
                  JAVAEOF

                  # Find all flutter.jar files in the engine cache
                  find "$FLUTTER_ROOT/bin/cache/artifacts/engine" -name "flutter.jar" | while read JAR; do
                    echo "Processing: $JAR"

                    # Check if this JAR contains LocalizationPlugin
                    if jar tf "$JAR" | grep -q "LocalizationPlugin.class"; then
                      echo "  Found LocalizationPlugin.class, patching..."

                      WORKDIR=$(mktemp -d)

                      # Extract the JAR
                      cd "$WORKDIR"
                      jar xf "$JAR"

                      # Build classpath from the JAR itself + Android SDK
                      ANDROID_JAR="$ANDROID_HOME/platforms/android-37/android.jar"
                      if [ ! -f "$ANDROID_JAR" ]; then
                        ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
                      fi
                      if [ ! -f "$ANDROID_JAR" ]; then
                        ANDROID_JAR="$ANDROID_HOME/platforms/android-34/android.jar"
                      fi
                      echo "  Using Android JAR: $ANDROID_JAR"

                      # Compile the patched class
                      javac -cp "$JAR:$ANDROID_JAR" \
                            -source 17 -target 17 \
                            --add-exports java.base/jdk.internal.misc=ALL-UNNAMED \
                            -d "$WORKDIR" \
                            /tmp/LocalizationPlugin.java 2>&1 || {
                        echo "  WARNING: Compilation failed, trying with relaxed options..."
                        javac -cp "$JAR:$ANDROID_JAR" \
                              -source 11 -target 11 \
                              -d "$WORKDIR" \
                              /tmp/LocalizationPlugin.java 2>&1 || {
                          echo "  ERROR: Could not compile patched LocalizationPlugin"
                          rm -rf "$WORKDIR"
                          continue
                        }
                      }

                      # Repackage the JAR with the patched class
                      jar cf "$JAR" -C "$WORKDIR" .
                      echo "  Successfully patched $JAR"

                      rm -rf "$WORKDIR"
                    else
                      echo "  No LocalizationPlugin found, skipping"
                    fi
                  done

                  echo "=== Flutter engine patching complete ==="

            - name: Apply Patch
              shell: pwsh
              run: lib/scripts/patch.ps1 android

            - name: 生成版本信息
              shell: pwsh
              run: lib/scripts/build.ps1 android

            - name: Flutter Build APK (Android 6 Compatible)
              run: |
                  flutter build apk --release --split-per-abi --dart-define-from-file=pili_release.json --no-pub

            - name: 重命名 APK
              run: |
                  for file in build/app/outputs/flutter-apk/app-*-release.apk; do
                    abi=$(echo "$file" | sed -E 's|.*app-(.*)-release\.apk|\1|')
                    mv "$file" "PiliPlus_android6_${{ env.version }}_${abi}.apk"
                  done
              shell: bash

            - name: 上传 arm64-v8a
              uses: actions/upload-artifact@v4
              with:
                  name: Android6_arm64-v8a
                  path: PiliPlus_android6_*_arm64-v8a.apk

            - name: 上传 armeabi-v7a
              uses: actions/upload-artifact@v4
              with:
                  name: Android6_armeabi-v7a
                  path: PiliPlus_android6_*_armeabi-v7a.apk

            - name: 上传 x86_64
              uses: actions/upload-artifact@v4
              with:
                  name: Android6_x86_64
                  path: PiliPlus_android6_*_x86_64.apk
