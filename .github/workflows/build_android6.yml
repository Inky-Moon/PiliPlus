name: Build Android 6 Compatible APK

on:
    workflow_dispatch:

jobs:
    android6:
        name: Build Android 6.0+ APK
        runs-on: ubuntu-latest
        permissions: write-all

        steps:
            - name: 代码迁出
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: 构建Java环境
              uses: actions/setup-java@v4
              with:
                  distribution: "zulu"
                  java-version: "17"
                  cache: "gradle"
                  cache-dependency-path: |
                      android/*.gradle*
                      android/**/gradle-wrapper.properties

            - name: 安装Flutter
              uses: subosito/flutter-action@v2
              id: flutter-action
              with:
                  channel: stable
                  flutter-version: '3.24.5'
                  cache: true

            - name: 安装 PowerShell
              run: |
                  sudo apt-get update
                  sudo apt-get install -y powershell

            - name: Apply Patch (Skipped for older Flutter to prevent git conflicts)
              shell: pwsh
              run: |
                  echo "Skipping patch.ps1 to avoid conflicts with Flutter 3.24.5"
                  # lib/scripts/patch.ps1 android

            - name: 生成版本信息
              shell: pwsh
              run: lib/scripts/build.ps1 android

            - name: Flutter Build APK (Android 6 Compatible)
              run: |
                  flutter build apk --release --split-per-abi --dart-define-from-file=pili_release.json --no-pub

            - name: 重命名 APK
              run: |
                  for file in build/app/outputs/flutter-apk/app-*-release.apk; do
                    abi=$(echo "$file" | sed -E 's|.*app-(.*)-release\.apk|\1|')
                    mv "$file" "PiliPlus_android6_${{ env.version }}_${abi}.apk"
                  done
              shell: bash

            - name: 上传 arm64-v8a
              uses: actions/upload-artifact@v4
              with:
                  name: Android6_arm64-v8a
                  path: PiliPlus_android6_*_arm64-v8a.apk

            - name: 上传 armeabi-v7a
              uses: actions/upload-artifact@v4
              with:
                  name: Android6_armeabi-v7a
                  path: PiliPlus_android6_*_armeabi-v7a.apk

            - name: 上传 x86_64
              uses: actions/upload-artifact@v4
              with:
                  name: Android6_x86_64
                  path: PiliPlus_android6_*_x86_64.apk
