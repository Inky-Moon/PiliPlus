name: Build Android 6 Compatible APK

on:
    push:
        branches:
            - main
    workflow_dispatch:

jobs:
    android6:
        name: Build Android 6.0+ APK
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: 代码迁出
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: 构建 Java 环境
              uses: actions/setup-java@v4
              with:
                  distribution: "zulu"
                  java-version: "17"
                  cache: "gradle"
                  cache-dependency-path: |
                      android/*.gradle*
                      android/**/gradle-wrapper.properties

            - name: 安装 Flutter
              uses: subosito/flutter-action@v2
              with:
                  channel: stable
                  flutter-version-file: pubspec.yaml
                  cache: true

            - name: 安装 PowerShell
              run: |
                  sudo apt-get update
                  sudo apt-get install -y powershell

            - name: 安装 Android SDK 37
              run: |
                  platform_jar=$(find "$ANDROID_HOME/platforms" -maxdepth 2 \
                    -path '*/android-37*/android.jar' -print -quit)
                  if [[ -z "$platform_jar" ]]; then
                    echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
                      "platforms;android-37"
                    platform_jar=$(find "$ANDROID_HOME/platforms" -maxdepth 2 \
                      -path '*/android-37*/android.jar' -print -quit)
                  fi
                  [[ -n "$platform_jar" && -f "$platform_jar" ]]
                  echo "Using Android platform: $platform_jar"

            - name: 应用项目补丁
              shell: pwsh
              run: lib/scripts/patch.ps1 android

            - name: 准备 Android 6 Flutter Engine
              run: bash tool/android6/prepare_engine.sh

            - name: 生成版本信息
              shell: pwsh
              run: lib/scripts/build.ps1 android

            - name: 构建 Android 6 APK
              run: |
                  flutter build apk \
                    --release \
                    --split-per-abi \
                    --dart-define-from-file=pili_release.json \
                    --android-project-arg android6Compatibility=1 \
                    --no-pub

            - name: 验证 Flutter Engine 依赖
              working-directory: android
              run: >-
                  ./gradlew --refresh-dependencies -Pandroid6Compatibility=1
                  :app:verifyAndroid6FlutterEmbedding --no-daemon

            - name: 验证最终 APK 字节码
              run: bash tool/android6/verify_apk.sh build/app/outputs/flutter-apk/app-*-release.apk

            - name: 重命名 APK
              shell: bash
              run: |
                  for file in build/app/outputs/flutter-apk/app-*-release.apk; do
                    abi=$(echo "$file" | sed -E 's|.*app-(.*)-release\.apk|\1|')
                    mv "$file" "PiliPlus_android6_${{ env.version }}_${abi}.apk"
                  done

            - name: 发布到 Releases
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: custom-build-${{ github.run_number }}
                  name: "定制版构建 #${{ github.run_number }}"
                  body: "改进了一些体验，修复了一些 bug，增加了一些功能"
                  files: PiliPlus_android6_*.apk
