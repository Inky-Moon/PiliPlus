name: Build Android 6 Compatible APK

on:
    push:
        branches:
            - main
    workflow_dispatch:

jobs:
    android6:
        name: Build Android 6.0+ APK
        runs-on: ubuntu-latest
        permissions: write-all

        steps:
            - name: 代码迁出
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: 构建Java环境
              uses: actions/setup-java@v4
              with:
                  distribution: "zulu"
                  java-version: "17"
                  cache: "gradle"
                  cache-dependency-path: |
                      android/*.gradle*
                      android/**/gradle-wrapper.properties

            - name: 安装Flutter
              uses: subosito/flutter-action@v2
              id: flutter-action
              with:
                  channel: stable
                  flutter-version-file: pubspec.yaml
                  cache: true

            - name: 安装 PowerShell
              run: |
                  sudo apt-get update
                  sudo apt-get install -y powershell

            - name: 安装 Android SDK 37
              run: |
                  echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-37" || true

            - name: 修补 Flutter 引擎以兼容 Android 6 (API 23)
              run: |
                  echo "=== Downloading Gradle Dependencies ==="
                  flutter pub get
                  cd android && ./gradlew :app:dependencies || true
                  ./gradlew --stop || true
                  cd ..

                  echo "=== Setting up Javassist ==="
                  wget https://repo1.maven.org/maven2/org/javassist/javassist/3.29.2-GA/javassist-3.29.2-GA.jar -O /tmp/javassist.jar

                  echo "=== Writing Patcher.java ==="
                  cat > /tmp/Patcher.java << 'JAVAEOF'
                  import java.io.*;
                  import javassist.*;
                  import javassist.expr.*;

                  public class Patcher {
                      public static void main(String[] args) throws Exception {
                          String jarPath = args[0];
                          String androidJarPath = args[1];
                          ClassPool pool = ClassPool.getDefault();
                          pool.insertClassPath(jarPath);
                          pool.insertClassPath(androidJarPath);

                          boolean patched = false;
                          
                          try {
                              CtClass cc = pool.get("io.flutter.plugin.localization.LocalizationPlugin");
                              cc.getDeclaredMethod("resolveNativeLocale").setBody("{ if ($1 == null || $1.isEmpty()) return null; return (java.util.Locale)$1.get(0); }");
                              cc.getDeclaredMethod("sendLocalesToFlutter").setBody("{ java.util.List locales = new java.util.ArrayList(); locales.add($1.locale); this.localizationChannel.sendLocales(locales); }");
                              cc.writeFile("/tmp/patched_classes");
                              System.out.println("Patched LocalizationPlugin");
                              patched = true;
                          } catch (Exception e) { e.printStackTrace(); }

                          try {
                              CtClass cc = pool.get("io.flutter.view.AccessibilityBridge");
                              cc.instrument(new ExprEditor() {
                                  public void edit(MethodCall m) throws CannotCompileException {
                                      if (m.getMethodName().equals("setImportantForAccessibility")) {
                                          m.replace("{ }");
                                      }
                                  }
                              });
                              cc.writeFile("/tmp/patched_classes");
                              System.out.println("Patched AccessibilityBridge");
                              patched = true;
                          } catch (Exception e) { e.printStackTrace(); }
                          
                          try {
                              CtClass cc = pool.get("io.flutter.view.AccessibilityViewEmbedder");
                              cc.instrument(new ExprEditor() {
                                  public void edit(MethodCall m) throws CannotCompileException {
                                      if (m.getMethodName().equals("setImportantForAccessibility")) {
                                          m.replace("{ }");
                                      }
                                  }
                              });
                              cc.writeFile("/tmp/patched_classes");
                              System.out.println("Patched AccessibilityViewEmbedder");
                              patched = true;
                          } catch (Exception e) { e.printStackTrace(); }

                          try {
                              CtClass cc = pool.get("io.flutter.util.PathUtils");
                              cc.getDeclaredMethod("getDataDirectory").setBody("{ return $1.getApplicationInfo().dataDir; }");
                              cc.writeFile("/tmp/patched_classes");
                              System.out.println("Patched PathUtils");
                              patched = true;
                          } catch (Exception e) { e.printStackTrace(); }
                          
                          if (!patched) {
                              System.out.println("No classes patched!");
                          }
                      }
                  }
                  JAVAEOF

                  javac -cp /tmp/javassist.jar /tmp/Patcher.java

                  echo "=== Patching Flutter engine JARs for API 23 compatibility ==="
                  ANDROID_JAR=$(ls -1 $ANDROID_HOME/platforms/android-*/android.jar 2>/dev/null | sort -V | tail -n 1)
                  echo "Using Android JAR: $ANDROID_JAR"
                  
                  # Directly download the Flutter engine JAR from Google Maven to avoid Gradle cache reliance
                  ENGINE_VERSION=$(cat $FLUTTER_ROOT/bin/internal/engine.version)
                  VERSION="1.0.0-$ENGINE_VERSION"
                  echo "Detected Flutter engine version: $VERSION"
                  
                  LOCAL_REPO="$GITHUB_WORKSPACE/android/local_repo/io/flutter/flutter_embedding_release/$VERSION"
                  mkdir -p "$LOCAL_REPO"
                  
                  URL_BASE="https://storage.googleapis.com/download.flutter.io/io/flutter/flutter_embedding_release/$VERSION"
                  curl -sL "$URL_BASE/flutter_embedding_release-$VERSION.jar" -o "$LOCAL_REPO/flutter_embedding_release-$VERSION.jar"
                  curl -sL "$URL_BASE/flutter_embedding_release-$VERSION.pom" -o "$LOCAL_REPO/flutter_embedding_release-$VERSION.pom"
                  
                  if [ ! -s "$LOCAL_REPO/flutter_embedding_release-$VERSION.jar" ]; then
                    echo "Failed to download flutter_embedding_release JAR!"
                    exit 1
                  fi
                  
                  RAW_JAR="$LOCAL_REPO/flutter_embedding_release-$VERSION.jar"
                  echo "Successfully downloaded JAR to $RAW_JAR"
                  
                  echo "Found raw JAR: $RAW_JAR"
                  
                  
                  # Patch the jar in the local maven repo
                  LOCAL_JAR="$LOCAL_REPO/flutter_embedding_release-$VERSION.jar"
                  mkdir -p /tmp/patched_classes
                  rm -rf /tmp/patched_classes/*
                  java -cp /tmp/javassist.jar:/tmp Patcher "$LOCAL_JAR" "$ANDROID_JAR"
                  if [ "$(ls -A /tmp/patched_classes)" ]; then
                     jar uf "$LOCAL_JAR" -C /tmp/patched_classes .
                     echo "Successfully updated local repo JAR"
                  fi
                  
                  # Rename the version to guarantee a cache miss in Gradle/R8!
                  NEW_VERSION="${VERSION}-patched"
                  NEW_REPO="$GITHUB_WORKSPACE/android/local_repo/io/flutter/flutter_embedding_release/$NEW_VERSION"
                  mv "$LOCAL_REPO" "$NEW_REPO"
                  mv "$NEW_REPO/flutter_embedding_release-$VERSION.jar" "$NEW_REPO/flutter_embedding_release-$NEW_VERSION.jar"
                  mv "$NEW_REPO/flutter_embedding_release-$VERSION.pom" "$NEW_REPO/flutter_embedding_release-$NEW_VERSION.pom"
                  
                  # Update the POM file version
                  sed -i "s|<version>$VERSION</version>|<version>$NEW_VERSION</version>|g" "$NEW_REPO/flutter_embedding_release-$NEW_VERSION.pom"

                  
                  # Inject the local Maven repository directly into settings.gradle.kts
                  cat << 'SETTINGS_PATCH' >> android/settings.gradle.kts
                  
                  dependencyResolutionManagement {
                      repositories {
                          exclusiveContent {
                              forRepository {
                                  maven { url = uri("file://${System.getenv("GITHUB_WORKSPACE")}/android/local_repo") }
                              }
                              filter {
                                  includeModule("io.flutter", "flutter_embedding_release")
                              }
                          }
                      }
                  }
                  
                  SETTINGS_PATCH
                  
                  echo "=== Hacking Flutter SDK Gradle scripts to use -patched version ==="
                  find $FLUTTER_ROOT/packages/flutter_tools/gradle -type f \( -name "*.groovy" -o -name "*.gradle" -o -name "*.kts" \) -exec sed -i 's/1.0.0-${flutterEngineHash}/1.0.0-${flutterEngineHash}-patched/g' {} +
                  find $FLUTTER_ROOT/packages/flutter_tools/gradle -type f \( -name "*.groovy" -o -name "*.gradle" -o -name "*.kts" \) -exec sed -i 's/1.0.0-\$flutterEngineHash/1.0.0-\$flutterEngineHash-patched/g' {} +
                  
                  echo "=== Purging Gradle Modules Cache for flutter_embedding_release ==="
                  rm -rf ~/.gradle/caches/modules-2/files-2.1/io.flutter/flutter_embedding_release 2>/dev/null || true
                  
                  echo "=== Flutter engine patching complete ==="

            - name: Apply Patch
              shell: pwsh
              run: lib/scripts/patch.ps1 android

            - name: 生成版本信息
              shell: pwsh
              run: lib/scripts/build.ps1 android

            - name: Disable Gradle Build Cache Completely
              run: |
                  mkdir -p ~/.gradle
                  echo "org.gradle.caching=false" >> ~/.gradle/gradle.properties
                  echo "org.gradle.configuration-cache=false" >> ~/.gradle/gradle.properties
                  # Also kill any running daemons again just in case
                  cd android && ./gradlew --stop || true

            - name: Flutter Build APK (Android 6 Compatible)
              run: |
                  echo "=== Wiping Gradle build cache to force R8 recompilation ==="
                  rm -rf ~/.gradle/caches/build-cache-* 2>/dev/null || true
                  rm -rf ~/.gradle/caches/transforms-* 2>/dev/null || true
                  rm -rf ~/.gradle/caches/*/transforms/ 2>/dev/null || true
                  flutter build apk --release --split-per-abi --dart-define-from-file=pili_release.json --no-pub

            - name: 重命名 APK
              run: |
                  for file in build/app/outputs/flutter-apk/app-*-release.apk; do
                    abi=$(echo "$file" | sed -E 's|.*app-(.*)-release\.apk|\1|')
                    mv "$file" "PiliPlus_android6_${{ env.version }}_${abi}.apk"
                  done
              shell: bash


            - name: 发布到 Releases
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: custom-build-${{ github.run_number }}
                  name: "定制版构建 #${{ github.run_number }}"
                  body: "改进了一些体验，修复了一些bug，增加了一些功能" 
                  files: PiliPlus_android6_*.apk
